name: Portfolio CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. Lint & validate code
  lint_validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install linters
        run: |
          npm install --global htmlhint stylelint eslint

      - name: Lint HTML
        run: htmlhint "**/*.html"

      - name: Lint CSS
        run: stylelint "**/*.css" --config-basedir . --allow-empty-input || true

      - name: Lint JS
        run: eslint "**/*.js"

