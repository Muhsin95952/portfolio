name: Portfolio CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # 1. Lint & validate code
  lint_validate:
    name: Lint and Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install linters and configs
        run: |
          npm install --global htmlhint stylelint eslint stylelint-config-standard

      - name: Lint HTML
        run: htmlhint "**/*.html"

      - name: Lint CSS
        run: stylelint "**/*.css"

      - name: Lint JS
        run: eslint "**/*.js"

  # 3. Build Docker image
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: lint_validate
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Retag existing :latest to numeric tag (if present)
        run: |
          set -euo pipefail
          IMAGE="muhsin95952/muhsin-portfolio"
          USER="muhsin95952"
          REPO="muhsin-portfolio"
          # install jq to parse Docker Hub API
          sudo apt-get update -y
          sudo apt-get install -y jq

          # query Docker Hub for numeric tags
          tags=$(curl -s "https://registry.hub.docker.com/v2/repositories/${USER}/${REPO}/tags?page_size=100" | jq -r '.results[].name') || true
          nums=$(echo "$tags" | grep -E '^[0-9]+$' || true)
          if [ -n "$nums" ]; then
            max=$(echo "$nums" | sort -n | tail -n1)
            next=$((max+1))
          else
            next=1
          fi

          # if latest exists locally or on remote, pull it and push as numeric tag
          if docker pull "${IMAGE}:latest" >/dev/null 2>&1; then
            docker tag "${IMAGE}:latest" "${IMAGE}:${next}"
            docker push "${IMAGE}:${next}"
          else
            echo "No existing :latest image found to retag. Skipping."
          fi
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: muhsin95952/muhsin-portfolio:latest

  trivy_scan:
    name: Run Trivy Vulnerability Scan
    runs-on: ubuntu-24.04
    needs: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: muhsin95952/muhsin-portfolio:latest
          format: "table"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

  deploy-to-azure:
    runs-on: ubuntu-latest
    needs: trivy_scan
    steps:
      - name: Deploy container on VM
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # --- stop any container currently binding host port 80 ---
            PORT_CONTAINERS=$(docker ps --format '{{.ID}} {{.Ports}}' | grep -E '0.0.0.0:80|:80->' | awk '{print $1}' || true)
            if [ -n "$PORT_CONTAINERS" ]; then
              echo "Stopping containers using port 80: $PORT_CONTAINERS"
              echo "$PORT_CONTAINERS" | xargs -r docker stop || true
              echo "$PORT_CONTAINERS" | xargs -r docker rm -f || true
            fi

            # Also stop any container started from the previous image (defensive)
            docker ps -q --filter ancestor=muhsin95952/muhsin-portfolio:latest | xargs -r docker stop || true
            docker ps -aq --filter ancestor=muhsin95952/muhsin-portfolio:latest | xargs -r docker rm -f || true

            # verify port 80 is free; if not, abort so the runner log shows the occupying process
            if command -v ss >/dev/null 2>&1; then
              if ss -ltnp 2>/dev/null | grep -q ':80'; then
                echo "Port 80 is still in use after stopping containers. Aborting deploy." >&2
                ss -ltnp 2>/dev/null | grep ':80' || true
                exit 1
              fi
            elif command -v netstat >/dev/null 2>&1; then
              if netstat -tlnp 2>/dev/null | grep -q ':80'; then
                echo "Port 80 is still in use after stopping containers. Aborting deploy." >&2
                netstat -tlnp 2>/dev/null | grep ':80' || true
                exit 1
              fi
            fi

            # pull the newly pushed latest and run (give container a deterministic name)
            docker pull muhsin95952/muhsin-portfolio:latest
            # remove any container with the same name (defensive)
            docker rm -f muhsin_portfolio_app || true
            docker run -d --name muhsin_portfolio_app -p 80:80 muhsin95952/muhsin-portfolio:latest
